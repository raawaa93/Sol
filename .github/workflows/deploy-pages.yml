name: Deploy Volterra to GitHub Pages

on:
  # Deploy only after the main-branch CI workflow has passed. This avoids
  # publishing a commit whose tests/build have not completed successfully.
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    # workflow_run fires for failed CI too; deploy only successful main-branch CI.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact commit validated by CI
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build site for GitHub Pages
        run: npm run build:pages
        env:
          VITE_BINANCE_PROXY_URL: https://oyoyozdugicmnkfhjovo.supabase.co/functions/v1/volterra-binance-market-data
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5

  production-audit:
    name: Smoke test and Lighthouse on published site
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PUBLISHED_URL: ${{ needs.deploy.outputs.page_url }}
      # GitHub-hosted runners can egress from the US; do not probe Binance from this path.
      LIGHTHOUSE_REPORT_DIR: .lighthouseci-production
      LIGHTHOUSE_LABEL: Published GitHub Pages
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure Lighthouse Chrome path
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "No runner-provided browser found; installing Playwright Chromium as a fallback."
            npx playwright install --with-deps chromium
            CHROME_PATH="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath())')"
          fi
          "$CHROME_PATH" --version
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Verify published app and live market-data proxy
        run: npm run smoke:production
      - name: Collect published-site Lighthouse reports
        run: |
          mkdir -p .lighthouseci-production
          set +e
          npm run perf:lighthouse:production 2>&1 | tee .lighthouseci-production/lighthouse-ci.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            tail -n 50 .lighthouseci-production/lighthouse-ci.log >> "$GITHUB_STEP_SUMMARY"
            details="$(tail -c 4000 .lighthouseci-production/lighthouse-ci.log | tr '\r\n' ' ' | sed 's/%/%25/g')"
            echo "::error title=Production Lighthouse output::$details"
          fi
          exit "$result"
      - name: Summarize published-site Lighthouse results
        run: node scripts/summarize-lighthouse.mjs
      - name: Upload published-site reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: published-lighthouse-reports
          path: .lighthouseci-production/
          include-hidden-files: true
          retention-days: 14
