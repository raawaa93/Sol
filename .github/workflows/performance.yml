name: Lighthouse performance baseline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - arena/5d011bc6-sol
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production assets
        run: npm run build
      - name: Install Chromium for Lighthouse
        run: npx playwright install --with-deps chromium
      - name: Configure Lighthouse Chrome path
        run: |
          CHROME_PATH="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath())')"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Collect local Lighthouse reports
        run: npm run perf:lighthouse
      - name: Upload reports for review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
