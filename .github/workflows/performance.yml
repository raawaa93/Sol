name: Lighthouse performance baseline

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production assets
        run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Chromium for Lighthouse
        run: npx playwright install --with-deps chromium
      - name: Configure Lighthouse Chrome path
        run: |
          CHROME_PATH="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath())')"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Collect local Lighthouse reports
        run: |
          mkdir -p .lighthouseci
          set +e
          npm run perf:lighthouse 2>&1 | tee .lighthouseci/lighthouse-ci.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            tail -n 50 .lighthouseci/lighthouse-ci.log >> "$GITHUB_STEP_SUMMARY"
            details="$(tail -c 4000 .lighthouseci/lighthouse-ci.log | tr '\r\n' ' ' | sed 's/%/%25/g')"
            echo "::error title=Lighthouse CI output::$details"
          fi
          exit "$result"
      - name: Summarize representative Lighthouse results
        run: node scripts/summarize-lighthouse.mjs
      - name: Upload reports for review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 14

  production-smoke:
    name: Weekly published-site smoke test
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      PUBLISHED_URL: https://raawaa93.github.io/Sol
      BINANCE_PROXY_URL: https://oyoyozdugicmnkfhjovo.supabase.co/functions/v1/volterra-binance-market-data
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify published app and market-data proxy
        run: npm run smoke:production
