name: CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit and property tests
        run: npm test
      - name: Validate production smoke-test script syntax
        run: node --check scripts/smoke-production.mjs
      - name: Test age encryption and backup orchestration with a mocked database
        run: |
          bash -n scripts/backup-supabase.sh
          bash -n scripts/test-backup-supabase.sh
          bash -n scripts/validate-supabase-db-url.sh
          bash -n scripts/options-archive-termux-start.sh
          sudo apt-get update
          sudo apt-get install --yes age postgresql-client
          bash scripts/test-backup-supabase.sh
      - name: Install Supabase CLI v3
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Verify Supabase CLI v3 flags used by backup and restore
        run: |
          supabase db dump --help > /tmp/supabase-db-dump-help.txt
          supabase init --help > /tmp/supabase-init-help.txt
          supabase db start --help > /tmp/supabase-db-start-help.txt
          supabase stop --help > /tmp/supabase-stop-help.txt
          grep -Fq -- '--remote' /tmp/supabase-db-dump-help.txt
          grep -Fq -- '--workdir' /tmp/supabase-init-help.txt
          grep -Fq -- '--workdir' /tmp/supabase-db-start-help.txt
          grep -Fq -- '--workdir' /tmp/supabase-stop-help.txt
      - name: Rebuild Sol schema on disposable local Supabase Postgres
        shell: bash
        run: |
          set -Eeuo pipefail
          restore_dir="$(mktemp -d)"
          cleanup() {
            supabase stop --workdir "$restore_dir" --no-backup >/dev/null 2>&1 || true
            rm -rf "$restore_dir"
          }
          trap cleanup EXIT
          supabase init --workdir "$restore_dir"
          supabase db start --workdir "$restore_dir"
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            --single-transaction --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20261123160346_volterra_shared_rate_limits.sql \
            --file supabase/migrations/20261123160830_volterra_lock_down_rate_limit_table.sql \
            --file supabase/migrations/20261124052328_remove_non_sol_legacy_schemas_20261124.sql
          restore_check="$(PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres --tuples-only --no-align --command "SELECT (to_regclass('public.volterra_rate_limit_windows') IS NOT NULL)::int || ':' || COALESCE((SELECT relrowsecurity::int FROM pg_class WHERE oid = to_regclass('public.volterra_rate_limit_windows')), 0)::text || ':' || (to_regprocedure('public.volterra_check_rate_limit(text,integer,integer)') IS NOT NULL)::int || ':' || has_function_privilege('anon', 'public.volterra_check_rate_limit(text,integer,integer)', 'EXECUTE')::int || ':' || has_function_privilege('service_role', 'public.volterra_check_rate_limit(text,integer,integer)', 'EXECUTE')::int || ':' || has_table_privilege('service_role', 'public.volterra_rate_limit_windows', 'SELECT')::int")"
          if [[ "$restore_check" != "1:1:1:0:1:0" ]]; then
            echo "Disposable Sol schema rebuild failed access-control checks: $restore_check" >&2
            exit 1
          fi
          echo "Disposable local Sol schema rebuild passed: table, RLS, RPC and grants verified."
      - name: Build the app
        run: npm run build
      - name: Enforce compressed bundle budgets
        run: npm run perf:bundle
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Run browser journeys
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
