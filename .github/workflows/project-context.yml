name: Project Context Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-context-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-project-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fail closed if project identity is missing or changed
        run: node scripts/verify-project-context.mjs
